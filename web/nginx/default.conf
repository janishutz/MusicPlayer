server {
    listen       3000;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        # TODO: Check if this works
		try_files $uri $uri/ =200;
    }

    error_page  404 /index.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
